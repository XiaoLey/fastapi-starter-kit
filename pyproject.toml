[project]
name = "fastapi-starter-kit"
version = "0.1.0"
description = "带 PostgreSQL、Redis 和可替换短信认证的异步 FastAPI 模板"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "alembic-dddl==0.1.3",
    "apscheduler>=3.11.3,<4",
    "asyncpg>=0.32.0,<0.33",
    "fastapi>=0.162.0,<0.163",
    "httpx[http2]>=0.28.1,<0.29",
    "limits[redis]>=5.8,<6",
    "loguru>=0.7.3,<0.8",
    "pwdlib[argon2,bcrypt]>=0.3.1,<0.4",
    "pydantic>=2.14.1,<2.15",
    "pydantic-settings>=2.16,<3",
    "pyjwt>=2.10.1,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=7,<8",
    "sqlalchemy[asyncio]>=2.1.6,<3",
    "sqlalchemy-utils>=0.43,<1",
    "tzdata>=2026.1; sys_platform == 'win32'",
    "uvicorn[standard]>=0.54,<0.55",
    "starlette",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.17.2,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: 仅使用显式隔离的 PostgreSQL/Redis 测试服务", "process: 真实服务器或子进程测试"]
